<!DOCTYPE html>
<html>
<head>
    
</head>
<body>
    


<script>

let sysDate=new Date();

console.log(sysDate);

console.log(sysDate.toLocaleDateString());// only date format
console.log(sysDate.toDateString());// only date format

console.log(sysDate.toLocaleTimeString());// only time format
console.log(sysDate.toTimeString());// only time format


console.log(sysDate.getDay());//Thu=>4
console.log(sysDate.getDate());//10
console.log(sysDate.getMonth()+1);// month=>9=>
console.log(sysDate.getFullYear());//2024


// custom date format=> thus, 10-sep-2026


let daynames=["Sunday","Monday","Tueday","Wedday","Thuday","Friday","Satday"];
let months=["Jan","Feb","Mar","Apr","May","June","July","Aug","Sept","Oct","Nov","Dec"];


let date=new Date("2010","05","13","15","49","33");
console.log(date);

let customDate=`${daynames[`${date.getDay()}`]},${date.getDate()}-${months[`${date.getMonth()}`]}-${date.getFullYear()}`;
console.log(customDate);



let time=new Date();
console.log(time);

console.log(time.getHours());
console.log(time.getMinutes());
console.log(time.getSeconds());






</script>



</body>
</html>
