<!DOCTYPE html>
<html>

<head>

  <title>Amazon Products</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>


<body>


  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg bg-danger shadow sticky-top">

    <div class="container-fluid">

      <a class="navbar-brand text-white fw-bold fs-3" href="#">
        Amazon
      </a>


      <button class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav">

        <span class="navbar-toggler-icon"></span>

      </button>


      <div class="collapse navbar-collapse" id="navbarNav">

        <ul class="navbar-nav m-auto">

          <li class="nav-item">
            <a class="nav-link active text-white" href="#">
              Home
            </a>
          </li>


          <li class="nav-item">
            <a class="nav-link text-white" href="#">
              Features
            </a>
          </li>


          <li class="nav-item">
            <a class="nav-link text-white" href="#">
              Pricing
            </a>
          </li>


          <li class="nav-item">
            <a class="nav-link text-white" href="#">
              Contact
            </a>
          </li>

        </ul>

      </div>

    </div>

  </nav>



  <!-- Main Content -->
  <main>

    <div class="container-fluid">

      <div class="row">


        <!-- Category -->
        <div class="col-lg-2">

          <label class="text-muted mt-3 mb-2 fw-bold">
            Select a Category
          </label>


          <select class="form-select text-capitalize"
            id="dropdown"
            onchange="changeCategory()">

          </select>

        </div>



        <!-- Products -->
        <div class="col-lg-10">

          <div class="row" id="hello">

          </div>

        </div>


      </div>

    </div>

  </main>



  <script>


    // --------------------------------
    // LOAD CATEGORIES
    // --------------------------------

    function loadCategories() {

      fetch("https://fakestoreapi.com/products/categories")

        .then((res) => res.json())

        .then((categories) => {

          // Add All option
          categories.unshift("all");


          categories.map((category) => {

            document.getElementById("dropdown").innerHTML += `

              <option value="${category}">
                ${category}
              </option>

            `;

          });

        })

        .catch((error) => {

          console.log(error);

        });

    }


    // Call function
    loadCategories();



    // --------------------------------
    // LOAD PRODUCTS
    // --------------------------------

    function loadProducts(url) {

      fetch(url)

        .then((res) => res.json())

        .then((products) => {


          // Clear old products
          document.getElementById("hello").innerHTML = "";


          // Display products
          products.map((product) => {

            document.getElementById("hello").innerHTML += `

              <div class="col-lg-3 col-md-4 col-sm-6">


                <div class="card mt-3 shadow h-100">


                  <!-- Product Image -->
                  <div class="text-center p-3">

                    <img
                      src="${product.image}"
                      height="200"
                      width="100%"
                      style="object-fit: contain;"
                    >

                  </div>



                  <!-- Product Title -->
                  <div class="card-header bg-white">

                    <h6 class="text-truncate">
                      ${product.title}
                    </h6>

                  </div>



                  <!-- Product Details -->
                  <div class="card-body">


                    <dt>Category</dt>

                    <dd class="text-capitalize">
                      ${product.category}
                    </dd>



                    <dt>Price</dt>

                    <dd class="text-danger fw-bold">

                      &#8377;${product.price}

                    </dd>



                    <dt>Rating</dt>

                    <dd>

                      <span class="badge bg-success">

                        ${product.rating.rate}

                        <span class="bi bi-star-fill"></span>

                      </span>


                      <small class="text-muted">

                        (${product.rating.count} reviews)

                      </small>

                    </dd>



                    <!-- Add To Cart -->
                    <button
                      class="btn btn-danger mt-3 w-100">

                      <span class="bi bi-cart-plus"></span>

                      Add To Cart

                    </button>


                  </div>

                </div>

              </div>

            `;

          });

        })


        .catch((error) => {

          console.log("Error:", error);

        });

    }



    // --------------------------------
    // INITIAL PRODUCTS
    // --------------------------------

    loadProducts(
      "https://fakestoreapi.com/products"
    );



    // --------------------------------
    // CHANGE CATEGORY
    // --------------------------------

    function changeCategory() {


      let selectedCat =
        document.getElementById("dropdown").value;



      // All Products
      if (selectedCat == "all") {

        loadProducts(
          "https://fakestoreapi.com/products"
        );

      }


      // Selected Category
      else {

        loadProducts(
          `https://fakestoreapi.com/products/category/${selectedCat}`
        );

      }

    }


  </script>


</body>

</html>
