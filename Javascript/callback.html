<script>


// callback, higherorder function


function sum(a,b)
{
    return a+b;
}


function sub(a,b)
{
    return a-b;
}


let calculate=(a,b,hello)=>{

    return hello(a,b);// sum(a,b)=>12

}

let r1=calculate(10,2,sum);
let r2=calculate(100,20,sub);
console.log(r1);
console.log(r2);
let r3=calculate(8,5,(a,b)=>a*b);//40
console.log(r3);



// closure

function outer()
{

    let count=1;

    return function inner(){
        count=count+1;
        console.log(count);//2
    }
   
    

}

let r4=outer();
r4();
r4();
r4();
r4();
r4();







</script>


</body>
