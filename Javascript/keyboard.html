<!DOCTYPE html>
<html>
<head>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container mt-5">


    <input type="text" placeholder="Username" id="username"><br>
    <span id="hello1"></span>

<br><br>

    
    <input type="text" placeholder="Username" id="username1"><br>
    <span id="hello2"></span>
    <br>
    <br>

    <div class="card shadow-lg w-50 m-auto">

        <div class="card-header">
            <h3 class="text-secondary">Message App</h3>
        </div>

        <div class="card-body">
            <textarea class="form-control" rows="6" placeholder="Type Message (Max 100 characters)" maxlength="100" id="t1">

            </textarea>

        </div>

        <div class="card-footer">

            <p>Max characters :<span class="fw-bold" id="count">0</span>/100</p>

        </div>

    </div>


    <input type="text" placeholder="Password"  id="p1"> <br>
    <span id="s1"></span>


<script>

document.getElementById("username").addEventListener("blur",function(){


    document.getElementById("hello1").innerText="Please Enter Username";
    document.getElementById("hello1").style.color="red";


});


document.getElementById("username1").addEventListener("focus",function(){

  this.style.border="2px solid red";
    document.getElementById("hello2").innerText="Please Enter Username";
    document.getElementById("hello2").style.color="red";


});

document.getElementById("username1").addEventListener("blur",function(){


    document.getElementById("hello2").style.display="none";

});


document.getElementById("p1").addEventListener("keyup",function(){

    let password=this.value;

if(password.length==0)
{
    document.getElementById("s1").innerText="Please Enter Password";
    document.getElementById("s1").style.color="red";
}

else if(password.length>=5 && password.length<10)
{
    document.getElementById("s1").innerText="Medium Password";
    document.getElementById("s1").style.color="orange";
}

else if(password.length>10)
{

     document.getElementById("s1").innerText="Strong Password";
    document.getElementById("s1").style.color="green";
}



})
 
document.getElementById("t1").addEventListener("keyup",function(){

    let message=this.value;
    document.getElementById("count").innerText=message.length;



});

</script>
    
</body>
</html>
