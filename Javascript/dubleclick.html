<!DOCTYPE html>
<html>
<head>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container mt-5">


<img src="images/pizz4.jpg" width="200px" height="200px" id="zoom">


<img src="images/food10.jpg" width="200px" height="200px" id="img1">


<img src="images/food9.jpg" width="200px" height="200px" id="img2">

<marquee id="m1">Hello students</marquee>


<h1 id="h1">Java Full Stack</h1>


<div class="p-4 bg-light shadow-lg bg-body-secondary w-75  m-auto text-dark position-relative" style="height: 500px;" id="div1">

  
   
    
    <span class="bg-danger rounded-circle text-white p-2 position-absolute" id="circle">hello</span>

</div>



<script>

    document.getElementById("zoom").addEventListener("mouseup",function(){

        this.style.transform="scale(4,4)";
        this.style.transition="1s";

    })

     document.getElementById("zoom").addEventListener("mousedown",function(){

        this.style.transform="scale(0.5,0.5)";
        this.style.transition="1s";

    })

document.getElementById("div1").addEventListener("mousemove",function(e){


    document.getElementById("circle").style.left=e.clientX + "px";
     document.getElementById("circle").style.top=e.clientY + "px";

     document.getElementById("circle").style.position="fixed";
    
     document.getElementById("circle").transform = "translate(-50%, -50%)";

})

    document.getElementById("h1").addEventListener("mouseover",function(){
        this.style.color="red";
    });

 document.getElementById("h1").addEventListener("mouseout",function(){
        this.style.color="blue";
    });

document.getElementById("img2").addEventListener("mouseover",function(){

    this.setAttribute("src","images/food10.jpg")

});

document.getElementById("img2").addEventListener("mouseout",function(){

    this.setAttribute("src","images/food6.jpg");

});


    document.getElementById("m1").addEventListener("mouseover",function(){
         this.stop();
    });

    document.getElementById("m1").addEventListener("mouseout",function(){
         this.start();
    });
    

  
document.getElementById("img1").addEventListener("dblclick",function(){



  this.style.transform="scale(2,2) rotate(360deg)";
  this.style.borderRadius="50%";
  this.style.transition="1s";


});


</script>
    
</body>
</html>
