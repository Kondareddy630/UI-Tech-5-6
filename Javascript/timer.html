<!DOCTYPE html>
<html>
<head>
    <title>Timer</title>
</head>
<body>

    <h1 id="timer">10</h1>

    <h1 id="time"></h1>

    <script>

        let count = 10;

        function timer() {

            document.getElementById("timer").innerHTML = count;

            count--;

            if (count >= 0) {
                setTimeout(timer, 1000);
            } else {
                document.getElementById("timer").innerHTML = "🏏 Start go...";
            }
        }

        timer();



function clock()
{

let time=new Date().toLocaleTimeString('en-in',{timeZone:"asia/kolkata"});
document.getElementById("time").innerText=time;

}

clock();


setInterval(clock,1000);


    </script>

</body>
</html>
