<!DOCTYPE html>
<html>
<head>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
rel="stylesheet">

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Bootstrap Icons -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>
<body class="container mt-5">


<button class="btn btn-primary" name="hello" id="btn1" onclick="sendData(this,event)">Html</button>

<button class="btn btn-danger" name="hello" id="btn2">Css</button>


<div class="bg-danger p-4 m-4 text-white" id="parent">
    <h1>Parent</h1>

    <div class="bg-success p-4 text-white" id="child">
        <h2>Child</h2>
           
          <div class="bg-info p-4 text-white" id="grandchild">
            <h3>Grand child</h3>

          </div>

    </div>
</div>



<script>


document.getElementById("parent").addEventListener("click",function(e){
    alert("I am parent");
    e.stopPropagation();
    
},true);


document.getElementById("child").addEventListener("click",function(e){
    alert("I am child");
    e.stopPropagation();
   
},true);


document.getElementById("grandchild").addEventListener("click",function(e){
    alert("I am grand child");
    e.stopPropagation();
    
},true);



document.getElementById("btn2").addEventListener("click",function(e){


    console.log(e.target);
      console.log(e.target.className);
        console.log(e.target.name);
          console.log(e.target.id);

          console.log(e.clientX);
          console.log(e.clientY);
          console.log(e.altKey);
          console.log(e.ctrlKey);
          console.log(e.stopPropagation());
          console.log(e.preventDefault());
    
});




function sendData(ele,e)
{

    console.log(ele.className);
    console.log(ele.name);
    console.log(ele.id);

    console.log(e.clientX);
    console.log(e.clientY);
    console.log(e.altKey);
    console.log(e.ctrlKey);
    console.log(e.shiftKey);
    console.log(e.preventDefault());
    console.log(e.stopPropagation());



}

</script>
    
</body>
</html>
