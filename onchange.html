<!DOCTYPE html>
<html>

<head>

 

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
  </script>

  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

</head>


<body class="container mt-5">



  <div>
    <input type="password" placeholder="Password" id="t1"> <br>
    <input type="checkbox" id="c1"> <label>Show Password</label>
  </div>
  


<script>


document.getElementById("c1").addEventListener("change",function(){

let getValue=document.getElementById("t1").getAttribute("type");

if(getValue==="password")
{
document.getElementById("t1").setAttribute("type","text");
}

else{
  document.getElementById("t1").setAttribute("type","password");
}


})


</script>


</body>

</html>
